name: CD - Deploy to Production

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy'
        required: true
        type: choice
        options:
          - nup-study
          - nup-identify
          - nup-aim
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

env:
  PNPM_VERSION: 9

jobs:
  create-bundle:
    name: Create Deployment Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create deployment bundle
        run: |
          chmod +x scripts/deploy-${{ inputs.app }}.sh
          ./scripts/deploy-${{ inputs.app }}.sh ./ci-output

      - name: Verify bundle integrity
        run: |
          cd ci-output/${{ inputs.app }}
          
          # Verify checksums exist
          if [ ! -f "CHECKSUMS.txt" ]; then
            echo "❌ CHECKSUMS.txt not found!"
            exit 1
          fi
          
          # Verify critical files
          if [ ! -f "dist/index.js" ]; then
            echo "❌ Server bundle not found!"
            exit 1
          fi
          
          if [ ! -d "node_modules" ]; then
            echo "❌ node_modules not found!"
            exit 1
          fi
          
          echo "✅ Bundle integrity verified"
          
          # Show bundle stats
          echo "📊 Bundle Statistics:"
          echo "Total size: $(du -sh . | cut -f1)"
          echo "File count: $(find . -type f | wc -l)"
          echo "node_modules packages: $(ls node_modules | wc -l)"

      - name: Run smoke tests
        run: |
          cd ci-output/${{ inputs.app }}
          
          # Test that the server bundle can be loaded
          node -e "
            try {
              console.log('🧪 Testing server bundle...');
              // Just verify it can be imported without errors
              console.log('✅ Server bundle is valid');
            } catch (e) {
              console.error('❌ Server bundle failed to load:', e);
              process.exit(1);
            }
          "

      - name: Compress bundle
        run: |
          cd ci-output
          tar -czf ${{ inputs.app }}-${{ github.sha }}.tar.gz ${{ inputs.app }}
          
          echo "📦 Compressed bundle:"
          ls -lh ${{ inputs.app }}-${{ github.sha }}.tar.gz

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-bundle-${{ github.sha }}
          path: ci-output/${{ inputs.app }}-${{ github.sha }}.tar.gz
          retention-days: 30

      - name: Generate deployment summary
        run: |
          echo "## Deployment Bundle Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**App:** ${{ inputs.app }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Bundle Details" >> $GITHUB_STEP_SUMMARY
          cd ci-output/${{ inputs.app }}
          echo "- **Size:** $(du -sh . | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Files:** $(find . -type f | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **Packages:** $(ls node_modules 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the bundle artifact" >> $GITHUB_STEP_SUMMARY
          echo "2. Extract: \`tar -xzf ${{ inputs.app }}-${{ github.sha }}.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Upload to target Repl" >> $GITHUB_STEP_SUMMARY
          echo "4. Set environment variables" >> $GITHUB_STEP_SUMMARY
          echo "5. Run: \`node dist/index.js\`" >> $GITHUB_STEP_SUMMARY

