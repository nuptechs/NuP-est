name: CI - Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PNPM_VERSION: 9

jobs:
  detect-changes:
    name: Detect Changed Apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
      packages: ${{ steps.detect.outputs.packages }}
      features: ${{ steps.detect.outputs.features }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed workspaces
        id: detect
        run: |
          # Get base ref for comparison
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # For PRs: compare against base branch
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            # For pushes: use event.before to capture ALL commits in push
            # Falls back to HEAD^ if event.before is not available
            BASE_REF="${{ github.event.before }}"
            if [ "$BASE_REF" = "" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
              BASE_REF="HEAD^"
            fi
          fi
          
          # Use detect-affected.sh script
          chmod +x scripts/detect-affected.sh
          RESULT=$(./scripts/detect-affected.sh $BASE_REF HEAD)
          
          # Parse JSON output
          APPS=$(echo "$RESULT" | jq -c '.apps')
          PACKAGES=$(echo "$RESULT" | jq -c '.packages')
          FEATURES=$(echo "$RESULT" | jq -c '.features')
          
          echo "apps=$APPS" >> $GITHUB_OUTPUT
          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT
          echo "features=$FEATURES" >> $GITHUB_OUTPUT
          
          echo "Changed apps: $APPS"
          echo "Changed packages: $PACKAGES"
          echo "Changed features: $FEATURES"

  build-packages:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --filter "./packages/@nup/*" run build

      - name: Cache package builds
        uses: actions/cache/save@v4
        with:
          path: packages/@nup/*/dist
          key: packages-${{ github.sha }}

  build-features:
    name: Build Features
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: |
      needs.detect-changes.outputs.features != '[]' || 
      needs.detect-changes.outputs.packages != '[]'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore package builds
        uses: actions/cache/restore@v4
        with:
          path: packages/@nup/*/dist
          key: packages-${{ github.sha }}
        continue-on-error: true

      - name: Build features
        run: pnpm -r --filter "./features/@nup/*" run build

      - name: Cache feature builds
        uses: actions/cache/save@v4
        with:
          path: features/@nup/*/dist
          key: features-${{ github.sha }}

  build-apps:
    name: Build App - ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.apps != '[]'
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore package builds
        uses: actions/cache/restore@v4
        with:
          path: packages/@nup/*/dist
          key: packages-${{ github.sha }}
        continue-on-error: true

      - name: Restore feature builds
        uses: actions/cache/restore@v4
        with:
          path: features/@nup/*/dist
          key: features-${{ github.sha }}
        continue-on-error: true

      - name: Build app
        run: |
          cd apps/${{ matrix.app }}
          pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-build
          path: apps/${{ matrix.app }}/dist
          retention-days: 7

  test-validation:
    name: Validate Deployment - ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [detect-changes, build-apps]
    if: |
      always() &&
      needs.build-apps.result == 'success'
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate app structure
        run: |
          chmod +x scripts/validate-app.sh
          ./scripts/validate-app.sh ${{ matrix.app }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.app }}-build
          path: apps/${{ matrix.app }}/dist

      - name: Verify build output
        run: |
          if [ ! -f "apps/${{ matrix.app }}/dist/index.js" ]; then
            echo "❌ Server bundle not found!"
            exit 1
          fi
          echo "✅ Build output verified"
          ls -lh apps/${{ matrix.app }}/dist/

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, build-packages, build-features, build-apps, test-validation]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changed Workspaces" >> $GITHUB_STEP_SUMMARY
          echo "- **Apps:** ${{ needs.detect-changes.outputs.apps }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Packages:** ${{ needs.detect-changes.outputs.packages }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Features:** ${{ needs.detect-changes.outputs.features }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "- Build Packages: ${{ needs.build-packages.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Features: ${{ needs.build-features.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Apps: ${{ needs.build-apps.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Validation: ${{ needs.test-validation.result }}" >> $GITHUB_STEP_SUMMARY
