<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Campos Personalizados</title>
  <link rel="stylesheet" href="/widgets/styles.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>⚙️ Gerenciar Campos Personalizados</h1>
      <p class="subtitle">Configure campos customizados para cada seção do sistema</p>
    </div>
  </header>

  <div class="container">
    <div class="main-content">
      <!-- Sections Panel -->
      <aside class="sections-panel">
        <h2>Seções / Telas</h2>
        <div id="sectionsList">
          <!-- Sections will be loaded here -->
        </div>
      </aside>

      <!-- Fields Panel -->
      <main class="fields-panel">
        <div class="fields-header">
          <h2 id="selectedSectionName">Selecione uma seção</h2>
          <button id="addFieldBtn" class="btn btn-primary">
            <span>+</span> Adicionar Campo
          </button>
        </div>
        
        <div id="fieldsList">
          <!-- Fields will be loaded here -->
        </div>
      </main>
    </div>
  </div>

  <!-- Field Editor Modal -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Adicionar Novo Campo</h3>
        <button id="closeModalBtn" class="modal-close">×</button>
      </div>
      
      <form id="fieldForm">
        <div class="modal-body">
          <input type="hidden" id="fieldId">
          
          <div class="form-group">
            <label class="form-label" for="fieldName">Nome do Campo (identificador único)</label>
            <input type="text" id="fieldName" class="form-input" placeholder="ex: numero_protocolo" required>
            <p class="form-help">Use letras minúsculas e underscore. Sem espaços ou caracteres especiais.</p>
          </div>

          <div class="form-group">
            <label class="form-label" for="fieldLabel">Label (rótulo visível)</label>
            <input type="text" id="fieldLabel" class="form-input" placeholder="ex: Número do Protocolo" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="fieldType">Tipo de Campo</label>
            <select id="fieldType" class="form-select" required>
              <option value="text">Texto</option>
              <option value="textarea">Texto Longo</option>
              <option value="number">Número</option>
              <option value="date">Data</option>
              <option value="select">Seleção (Dropdown)</option>
              <option value="checkbox">Checkbox</option>
              <option value="radio">Radio Button</option>
              <option value="email">E-mail</option>
              <option value="url">URL</option>
              <option value="file">Arquivo</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">
              <input type="checkbox" id="fieldRequired" class="form-checkbox">
              Campo obrigatório
            </label>
          </div>

          <div class="form-group">
            <label class="form-label" for="fieldPlaceholder">Placeholder (texto de exemplo)</label>
            <input type="text" id="fieldPlaceholder" class="form-input" placeholder="ex: Digite o número do protocolo...">
          </div>

          <div class="form-group">
            <label class="form-label" for="fieldDefaultValue">Valor Padrão (opcional)</label>
            <input type="text" id="fieldDefaultValue" class="form-input" placeholder="Valor pré-preenchido">
          </div>

          <div class="preview-section">
            <div class="preview-label">Preview:</div>
            <div id="fieldPreview">
              <!-- Preview will be rendered here -->
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" id="cancelFieldBtn" class="btn btn-secondary">Cancelar</button>
          <button type="button" id="saveFieldBtn" class="btn btn-primary">Salvar Campo</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/widgets/admin.js"></script>
</body>
</html>
